name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 说明：本工作流只做「构建 + 合规」检查，**不发布任何产物**。
# 打包发布（三平台安装包 + Release）在 M5 配置好本项目自己的发布源后再新增，
# 届时必须指向本项目仓库——上游的 build.yaml 会发布到 qier222/YesPlayMusic。

jobs:
  build:
    name: Build (Node 16 + yarn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SPDX 检查需要基线 tag
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install dependencies
        # --ignore-optional：跳过平台相关的可选依赖，避免 Linux 上解析 macOS/Windows 专用包
        run: yarn install --ignore-optional

      - name: Build (web)
        run: yarn build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: aki-music-web-dist
          path: dist/
          if-no-files-found: warn

  compliance:
    name: Compliance (SPDX headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SPDX headers on newly added source files
        run: sh scripts/check-spdx.sh
