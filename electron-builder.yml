# SPDX-License-Identifier: AGPL-3.0-or-later
#
# electron-builder 打包配置（M1b 起启用）。
#
# 构建：pnpm electron:build   （先构建渲染产物与主进程，再交给 electron-builder）
# 单独验证文件布局：pnpm electron:build:dir
#
# 图标：母图为 build/icon.png，全套由 `pnpm icons` 生成到 build/icons/
#   （scripts/generate-icons.mjs，取代上游的 electron-icon-builder）

appId: com.asamo.aki.player
productName: Aki Music
copyright: Copyright © Asamo096
# 产物文件名统一为小写连字符形式，避免 productName 中的空格进入文件名
artifactName: aki-music-${os}-${version}-${arch}.${ext}
asar: true

# 发布源（publish）在 M5 配置本项目自己的仓库。
# 上游原配置指向 qier222/YesPlayMusic，沿用会把安装包上传到上游的 Release。

directories:
  output: dist_electron

# 打入产物的文件。
# 主进程采用「依赖外部化」策略（见 scripts/build-main.mjs），因此运行时依赖
# 必须随包分发——electron-builder 会自动收集 package.json 的 dependencies，
# 无需在此列出 node_modules。
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'

# 原生扩展不能从 asar 内加载，必须解包到磁盘
asarUnpack:
  - '**/*.node'

# 不重建原生模块。本项目的原生依赖都有现成产物或可安全缺失：
#   - @unblockneteasemusic/rust-napi：经 optionalDependencies 分发各平台
#     预编译二进制（win32-x64-msvc / linux-x64-gnu / darwin-x64 …），无需编译
#   - abstract-socket：dbus-next 的**可选**依赖，且源码明确只支持 Linux
#     （Windows 上编译会直接 #error）。缺失时 dbus-next 自动降级，
#     不影响 MPRIS 可用性。
# 否则在 Windows 上打包会因为 abstract-socket 编译失败而中断。
npmRebuild: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64, universal]
  category: public.app-category.music
  darkModeSupport: true
  icon: build/icons/icon.icns

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  # electron-builder 26 起，签名/发行者相关选项从 win 顶层移到 signtoolOptions 下
  # （win.publisherName 已不再合法，会被 schema 校验拒绝）
  signtoolOptions:
    publisherName: Asamo096
  icon: build/icons/icon.ico

linux:
  # Linux 可执行文件名；默认取 productName 会产生带空格的命令
  executableName: aki-music
  category: Music
  # 指向 PNG 尺寸目录（16x16.png … 1024x1024.png），而非 .icns。
  # 上游此处误指 build/icon.icns——那是 macOS 格式，Linux 用不了。
  icon: build/icons/
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]
    - target: deb
      arch: [x64, armv7l, arm64]
    - target: rpm
      arch: [x64]
    - target: snap
      arch: [x64]
    - target: pacman
      arch: [x64]

dmg:
  icon: build/icons/icon.icns

nsis:
  # portable 与 nsis 的扩展名都是 .exe，若共用顶层 artifactName 会互相覆盖，
  # 因此这里按 target 分别命名
  artifactName: aki-music-${version}-setup.${ext}
  oneClick: true
  perMachine: true
  deleteAppDataOnUninstall: true

portable:
  artifactName: aki-music-${version}-portable.${ext}
