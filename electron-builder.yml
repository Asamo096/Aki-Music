# SPDX-License-Identifier: AGPL-3.0-or-later
#
# electron-builder 打包配置（M1b 起启用）。
#
# 构建：pnpm electron:build   （先构建渲染产物与主进程，再交给 electron-builder）
# 单独验证文件布局：pnpm electron:build:dir
#
# 图标：母图为 build/icon.png，全套由 `pnpm icons` 生成到 build/icons/
#   （scripts/generate-icons.mjs，取代上游的 electron-icon-builder）

appId: com.asamo.aki.player
productName: Aki Music
copyright: Copyright © Asamo096
# 产物文件名统一为小写连字符形式，避免 productName 中的空格进入文件名
artifactName: aki-music-${os}-${version}-${arch}.${ext}
asar: true

# 发布源：本项目的 GitHub Releases。electron-builder 会把这份配置写入
# resources/app-update.yml，electron-updater 启动时据此检查更新。
# 正式发布时用 GH_TOKEN=... pnpm electron:build --publish always。
publish:
  provider: github
  owner: Asamo096
  repo: Aki-Music

directories:
  output: dist_electron

# 打入产物的文件。
#
# ⚠ 平台配置节（win/mac/linux）里的 `files` 会**取代**本清单，而不是追加。
#   因此凡是写了平台级 files 的地方，都必须把下面这几条基础规则**重复一遍**，
#   否则白名单失效、整个项目根目录（src/、test/ 等）都会被塞进产物。
#
# 主进程采用「依赖外部化」策略（见 scripts/build-main.mjs），运行时依赖由
# electron-builder 按 package.json 的 dependencies 自动收集，无需在此列出。
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'

# 原生扩展不能从 asar 内加载，必须解包到磁盘
asarUnpack:
  - '**/*.node'

# koffi（桌面歌词的壁纸层注入）原生二进制的位置问题：
#   koffi 3.x 把 .node 放在独立平台包 @koromix/koffi-<platform>-<arch> 里，而且是 koffi 的
#   optionalDependencies；pnpm 的严格布局下它在虚拟目录里，electron-builder 不会自动
#   带进产物（实测 asar 里只有 koffi 的 JS，没有二进制），而 extraResources 的 `from`
#   不支持 glob。
#   解决：beforePack 钩子（scripts/before-pack.cjs）按当前平台把该包暂存到
#   build/native/koffi，再由这里拷进 resources/koffi —— koffi 的加载器会探测
#   `resourcesPath/koffi/<triplet>/koffi.node`，平台包内目录名恰好是 <platform>_<arch>。
beforePack: scripts/before-pack.cjs
extraResources:
  - from: build/native/koffi
    to: koffi

# 不重建原生模块。本项目的原生依赖都有现成产物或可安全缺失：
#   - @unblockneteasemusic/rust-napi：经 optionalDependencies 分发各平台
#     预编译二进制（win32-x64-msvc / linux-x64-gnu / darwin-x64 …），无需编译
#   - abstract-socket：dbus-next 的**可选**依赖，且源码明确只支持 Linux
#     （Windows 上编译会直接 #error）。缺失时 dbus-next 自动降级，
#     不影响 MPRIS 可用性。
# 否则在 Windows 上打包会因为 abstract-socket 编译失败而中断。
npmRebuild: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64, universal]
  category: public.app-category.music
  darkModeSupport: true
  icon: build/icons/icon.icns
  # 见 win.files 的说明：只保留 macOS 的原生二进制（基础规则需重复）
  files:
    - dist/**
    - dist-electron/**
    - package.json
    - '!**/*.map'
    - '!node_modules/@unblockneteasemusic/rust-napi-android-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-freebsd-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-linux-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-win32-*/**'

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  # electron-builder 26 起，签名/发行者相关选项从 win 顶层移到 signtoolOptions 下
  # （win.publisherName 已不再合法，会被 schema 校验拒绝）
  signtoolOptions:
    publisherName: Asamo096
  icon: build/icons/icon.ico
  # 原生二进制按目标平台裁剪。
  # @unblockneteasemusic/rust-napi 经 optionalDependencies 带了 13 个平台的预编译
  # 二进制（合计约 93 MB），全部打进去会白白撑大安装包。各平台配置节都支持 files，
  # 因此可以静态声明，不必写 afterPack 钩子。
  # 本平台只针对 Windows x64 打包，故保留 win32-x64-msvc、剔除其余。
  # ⚠ 基础规则必须重复（见文件顶部说明）
  files:
    - dist/**
    - dist-electron/**
    - package.json
    - '!**/*.map'
    - '!node_modules/@unblockneteasemusic/rust-napi-android-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-darwin-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-freebsd-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-linux-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-win32-arm64-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-win32-ia32-*/**'

linux:
  # Linux 可执行文件名；默认取 productName 会产生带空格的命令
  executableName: aki-music
  category: Music
  # 指向 PNG 尺寸目录（16x16.png … 1024x1024.png），而非 .icns。
  # 上游此处误指 build/icon.icns——那是 macOS 格式，Linux 用不了。
  icon: build/icons/
  # 见 win.files 的说明：只保留 Linux 的原生二进制（基础规则需重复）
  files:
    - dist/**
    - dist-electron/**
    - package.json
    - '!**/*.map'
    - '!node_modules/@unblockneteasemusic/rust-napi-android-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-darwin-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-freebsd-*/**'
    - '!node_modules/@unblockneteasemusic/rust-napi-win32-*/**'
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]
    - target: deb
      arch: [x64, armv7l, arm64]
    - target: rpm
      arch: [x64]
    - target: snap
      arch: [x64]
    - target: pacman
      arch: [x64]

dmg:
  icon: build/icons/icon.icns

nsis:
  # portable 与 nsis 的扩展名都是 .exe，若共用顶层 artifactName 会互相覆盖，
  # 因此这里按 target 分别命名
  artifactName: aki-music-${version}-setup.${ext}
  oneClick: true
  perMachine: true
  # 音乐应用的设置/缓存/一起听登录态都在用户数据目录；卸载不主动清空，
  # 避免升级或误卸载导致用户数据丢失（用户可手动清理缓存）。
  deleteAppDataOnUninstall: false

portable:
  artifactName: aki-music-${version}-portable.${ext}
