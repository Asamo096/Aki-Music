# pnpm 11 起，pnpm 的设置项从 package.json 的 "pnpm" 字段迁移到本文件。
#
# allowBuilds
#   pnpm 默认拦截依赖的安装脚本（供应链护栏），这里逐个显式表态。
#   真正需要放行的只有 esbuild（安装脚本校验/补装平台二进制）。
#   其余条目的成因各不相同，注释已分别说明。
#
# overrides
#   degenerator 是 pac-proxy-agent 依赖链上的安全钉子（沿用上游 resolutions 的意图）。

allowBuilds:
  # esbuild 靠安装脚本校验/补装平台二进制
  esbuild: true
  # 以下依赖本身没有安装脚本，条目无实际作用；保留是为了显式声明「可信」，
  # 也避免 pnpm 每次安装都把它们列为待表态项。
  #   electron：43 起不再声明 postinstall，改为懒下载（见下方说明）
  #   sharp：平台二进制来自 optionalDependencies
  electron: true
  sharp: true
  # 以下依赖的安装脚本与运行无关，明确拒绝
  '@parcel/watcher': false
  abstract-socket: false
  core-js: false
  es5-ext: false
  electron-winstaller: false # 只服务 Squirrel.Windows，本项目用 portable + nsis
  husky: false
  plyr: false
  #   koffi：FFI 原生模块（桌面歌词的壁纸层注入用）。3.x 在 npm 包里自带
  #   各平台预编译二进制，安装脚本只做校验/兜底编译；显式放行。
  koffi: true

overrides:
  degenerator: 2.2.0

# 关于 Electron 的二进制（M1b 起）
#   Electron 43 的 npm 包**没有 postinstall**，二进制由 index.js 在首次
#   require('electron') 时懒下载（见 electron/index.js 的 downloadElectron）。
#   因此 pnpm install 不会、也不需要下载 Electron。
#   上游 Electron 13 的安装脚本依赖旧版 extract-zip，在 Node 24 下会静默失败；
#   升级到 43 后该问题不复存在（新版用 @electron-internal/extract-zip）。
